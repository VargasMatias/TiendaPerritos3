spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        "[spring.json.value.default.type]": "cl.duoc.tiendaperritos.product_service.kafka.dto.ProductoEventoDto"
        "[spring.json.trusted.packages]": "cl.duoc.tiendaperritos.product_service.kafka.dto"
        "[spring.json.use.type.headers]": false

    listener:
      ack-mode: record
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    dynamic: true

    listener:
      simple:
        acknowledge-mode: manual
app:
  kafka:
    topics:
      eventos: productos.eventos
      auditoria: productos.auditoria
  rabbit:
    exchanges:
      direct: productos.direct
      topic: productos.topic
      dlx: productos.dlx

    queues:
      notifications: notifications.queue
      audit: audit.queue
      documents: documents.queue
      notifications-dlq: notifications.dlq
      audit-dlq: audit.dlq
      documents-dlq: documents.dlq

    routing-keys:
      notification: producto.created
      updated: producto.updated
      deleted: producto.deleted
      audit: producto.*
      document: producto.document

      notifications-dead: notifications.dead
      audit-dead: audit.dead
      documents-dead: documents.dead
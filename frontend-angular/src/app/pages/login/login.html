<div class="login-page">

    <div class="login-card">

        <h1>🐶 TiendaPerritos</h1>

        <h2>Bienvenido</h2>

        <p>
            Inicia sesión para acceder
            a la tienda.
        </p>

        @if (!procesando) {

        <button type="button" (click)="iniciarSesion()">

            Iniciar sesión con Cognito

        </button>

        } @else {

        <p>
            Procesando inicio de sesión...
        </p>

        }

        @if (error) {

        <p class="error">
            {{ error }}
        </p>

        }

    </div>

</div>
